services:
  postgres:
    image: postgres:16-alpine
    container_name: cpool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cpool
    ports:
      - "5432:5432"
    volumes:
      - cpool_pg_data:/var/lib/postgresql/data

volumes:
  cpool_pg_data:
